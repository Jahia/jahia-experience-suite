version: 2
updates:
  # Infra images (proxy, LDAP, DB, mail, Keycloak...) referenced in docker-compose.yml.
  # Jahia / jCustomer / Elasticsearch / Kibana versions come from env variables and must stay matched:
  # they are never bumped by Dependabot.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
    ignore:
      # Infra images: patch/minor only, majors need a manual compatibility check
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Elasticsearch must stay matched with Jahia / jCustomer / Augmented Search
      - dependency-name: "elasticsearch"
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
      - dependency-name: "kibana"
      - dependency-name: "docker.elastic.co/kibana/kibana"
  - package-ecosystem: "docker"
    directory: "/images/elasticsearch"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    ignore:
      # Elasticsearch must stay matched with Jahia / jCustomer / Augmented Search
      - dependency-name: "elasticsearch"
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
