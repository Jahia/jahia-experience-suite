name: jahia-experience-suite

volumes:
  esdata:
  mariadb:
  openldap_data:
  letsencrypt:

services:
  mariadb:
    image: '${MARIADB_IMAGE}'
    hostname: mariadb
    deploy:
      resources:
        limits:
          memory: 1gb
    networks:
      - stack
    command: --max_allowed_packet=1073741824 --transaction-isolation=READ-UNCOMMITTED --innodb-lock-wait-timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: mariadbP@55
      MYSQL_DATABASE: jahia
      MYSQL_USER: jahia
      MYSQL_PASSWORD: jahia
      TZ: ${TIMEZONE}
    volumes:
      - mariadb:/var/lib/mysql

  elasticsearch:
    build:
      context: ./images/elasticsearch
      args:
        ELASTICSEARCH_IMAGE: ${ELASTICSEARCH_IMAGE}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - cluster.name=jahia-es-cluster
      - ELASTIC_PASSWORD=${SUPER_USER_PASSWORD}
      - TZ=${TIMEZONE}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    hostname: elasticsearch
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.elasticsearch.rule=Host(`elasticsearch.localhost`) || HostRegexp(`elasticsearch`)"
      - "traefik.http.routers.elasticsearch.entrypoints=websecure"
      - "traefik.http.routers.elasticsearch.tls=true"
      - "traefik.http.routers.elasticsearch.service=elasticsearch-http"
      - "traefik.http.services.elasticsearch-http.loadbalancer.server.port=9200"
      - "traefik.http.routers.elasticsearch-redirect.rule=Host(`elasticsearch.localhost`) || HostRegexp(`elasticsearch`)"
      - "traefik.http.routers.elasticsearch-redirect.entrypoints=web"
      - "traefik.http.routers.elasticsearch-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    deploy:
      resources:
        limits:
          memory: 2gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - stack
    volumes: # Persist ES data in seperate "esdata" volume
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: '${KIBANA_IMAGE}'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=${TIMEZONE}
      - xpack.security.enabled=true
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${SUPER_USER_PASSWORD}
      - server.publicBaseUrl=https://kibana.localhost
    hostname: kibana
    deploy:
      resources:
        limits:
          memory: 512mb
    depends_on:
      - elasticsearch
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.kibana.rule=Host(`kibana.localhost`) || Host(`kibana`)"
      - "traefik.http.routers.kibana.entrypoints=websecure"
      - "traefik.http.routers.kibana.tls=true"
      - "traefik.http.routers.kibana.service=kibana-http"
      - "traefik.http.services.kibana-http.loadbalancer.server.port=5601"
      - "traefik.http.routers.kibana-redirect.rule=Host(`kibana.localhost`) || Host(`kibana`)"
      - "traefik.http.routers.kibana-redirect.entrypoints=web"
      - "traefik.http.routers.kibana-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - stack

  jahia:
    image: '${JAHIA_IMAGE}'
    hostname: jahia
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 3gb
    networks:
      stack:
        ipv4_address: 172.16.1.30
    depends_on:
      - mariadb
    ports:
      - "8101:8101"
      - "8000:8000"
    extra_hosts:
      - jahia:127.0.0.1
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.jahia.rule=Host(`jahia.localhost`) || HostRegexp(`^.+\\.jahia\\.localhost$`)"
      - "traefik.http.routers.jahia.entrypoints=websecure"
      - "traefik.http.routers.jahia.tls=true"
      - "traefik.http.routers.jahia.service=jahia-http"
      - "traefik.http.services.jahia-http.loadbalancer.server.port=8080"
      - "traefik.http.routers.jahia-redirect.rule=Host(`jahia.localhost`)|| HostRegexp(`^.+\\.jahia\\.localhost$`)"
      - "traefik.http.routers.jahia-redirect.entrypoints=web"
      - "traefik.http.routers.jahia-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    environment:
      jahia_cfg_karaf_remoteShellHost: 0.0.0.0
      DB_VENDOR: mariadb
      DB_HOST: mariadb
      DB_NAME: jahia
      DB_USER: jahia
      DB_PASS: jahia
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
      CLUSTER_ENABLED: '${JAHIA_CLUSTER_ENABLED}'
      PROCESSING_SERVER: 'true'
      MAX_RAM_PERCENTAGE: 95
      JAHIA_PROPERTIES: ${JAHIA_PROPERTIES}
      CATALINA_OPTS: ${CATALINA_OPTS}
      RESTORE_MODULE_STATES: 'false'
      TZ: ${TIMEZONE}
      JPDA: 'true'
      EXECUTE_PROVISIONING_SCRIPT: 'http://web/provisioning.yaml'
    volumes:
      - ./volumes/jahia/sources:/var/jahia/sources

  jahia-browsing:
    image: '${JAHIA_IMAGE}'
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 3gb
    networks:
      - stack
    depends_on:
      - jahia
    scale: ${BROWSING_NODES}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.jahiabrowsing.rule=Host(`jahiabrowsing.localhost`) || HostRegexp(`^.+\\.jahiabrowsing\\.localhost$`)"
      - "traefik.http.routers.jahiabrowsing.entrypoints=websecure"
      - "traefik.http.routers.jahiabrowsing.tls=true"
      - "traefik.http.routers.jahiabrowsing.service=jahiabrowsing-http"
      - "traefik.http.services.jahiabrowsing-http.loadbalancer.server.port=8080"
      - "traefik.http.services.jahiabrowsing-http.loadbalancer.sticky.cookie.httponly=true"
      - "traefik.http.services.jahiabrowsing-http.loadbalancer.sticky.cookie.name=jahia_session"
      - "traefik.http.services.jahiabrowsing-http.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.routers.jahiabrowsing-redirect.rule=Host(`jahiabrowsing.localhost`)|| HostRegexp(`^.+\\.jahiabrowsing\\.localhost$`)"
      - "traefik.http.routers.jahiabrowsing-redirect.entrypoints=web"
      - "traefik.http.routers.jahiabrowsing-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    environment:
      jahia_cfg_karaf_remoteShellHost: 0.0.0.0
      DB_VENDOR: mariadb
      DB_HOST: mariadb
      DB_NAME: jahia
      DB_USER: jahia
      DB_PASS: jahia
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
      CLUSTER_ENABLED: '${JAHIA_CLUSTER_ENABLED}'
      PROCESSING_SERVER: 'false'
      PROCESSING_HOST: jahia
      MAX_RAM_PERCENTAGE: 95
      JAHIA_PROPERTIES: ${JAHIA_PROPERTIES}
      CATALINA_OPTS: ${CATALINA_OPTS}
      RESTORE_MODULE_STATES: 'false'
      TZ: ${TIMEZONE}
    profiles:
      - cluster

  jcustomer:
    image: ${UNOMI_IMAGE}
    networks:
      - stack
    environment:
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch:9200
      - UNOMI_ELASTICSEARCH_CLUSTERNAME=jahia-es-cluster
      - UNOMI_ELASTICSEARCH_USERNAME=elastic
      - UNOMI_ELASTICSEARCH_PASSWORD=${SUPER_USER_PASSWORD}
      - UNOMI_CLUSTER_PUBLIC_ADDRESS=http://localhost:8181
      - UNOMI_CLUSTER_INTERNAL_ADDRESS=https://jcustomer:9443
      - UNOMI_THIRDPARTY_PROVIDER1_IPADDRESSES=172.16.1.30
      - UNOMI_THIRDPARTY_PROVIDER1_ALLOWEDEVENTS=login,updateProperties
      - JAVA_MAX_MEM=2G
      - UNOMI_ROOT_PASSWORD=karaf
      - UNOMI_HAZELCAST_TCPIP_MEMBERS=jcustomer
      - JCUSTOMER_MAXMIND_GEOIP2_CITY_DATABASE_URL=${JCUSTOMER_MAXMIND_GEOIP2_CITY_DATABASE_URL}
    ports:
      - 9443:9443
      - 8102:8102
    deploy:
      resources:
        limits:
          memory: 2gb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.jcustomer.rule=Host(`jcustomer.localhost`)"
      - "traefik.http.routers.jcustomer.entrypoints=websecure"
      - "traefik.http.routers.jcustomer.tls=true"
      - "traefik.http.routers.jcustomer.service=jcustomer-http"
      - "traefik.http.services.jcustomer-http.loadbalancer.server.port=8181"
      - "traefik.http.routers.jcustomer-redirect.rule=Host(`jcustomer.localhost`)"
      - "traefik.http.routers.jcustomer-redirect.entrypoints=web"
      - "traefik.http.routers.jcustomer-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    depends_on:
      - elasticsearch

  web:
    image: nginx
    hostname: web
    deploy:
      resources:
        limits:
          memory: 128mb
    volumes:
      - ./provisioning:/usr/share/nginx/html:ro
    networks:
      - stack

  ldap:
    image: symas/openldap:latest
    hostname: dockerldap
    deploy:
      resources:
        limits:
          memory: 128mb
    ports:
      - '389:389'
      - '636:636'
    environment:
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_USERS=user01,user02
      - LDAP_PASSWORDS=password1,password2
      - LDAP_ROOT=dc=jahia,dc=com
      - LDAP_ADMIN_DN=cn=admin,dc=jahia,dc=com
      - BITNAMI_DEBUG=true
      - LDAP_LOGLEVEL=32768
    networks:
      - stack
    volumes:
      - ./volumes/ldap/ldifs:/ldifs
      - openldap_data:/openldap

  phpldapadmin:
    image: 'phpldapadmin/phpldapadmin:latest'
    hostname: 'phpldapadmin'
    environment:
      LDAP_HOST: 'dockerldap'
      LDAP_PORT: '1389'
      LDAP_BASE_DN: 'dc=jahia,dc=com'
      LDAP_ALLOW_GUEST: true
      APP_KEY: 'base64:hS60TEid82EFLHNiZlPDVf8NQ0KR2apY9CZ1gVZ4N94='
      APP_URL: 'https://phpldapadmin.localhost'
    depends_on:
      - 'ldap'
    deploy:
      resources:
        limits:
          memory: 512mb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.phpldapadmin.rule=Host(`phpldapadmin.localhost`)"
      - "traefik.http.routers.phpldapadmin.entrypoints=websecure"
      - "traefik.http.routers.phpldapadmin.tls=true"
      - "traefik.http.routers.phpldapadmin.service=phpldapadmin-http"
      - "traefik.http.services.phpldapadmin-http.loadbalancer.server.port=8080"
      - "traefik.http.routers.phpldapadmin-redirect.rule=Host(`phpldapadmin.localhost`)"
      - "traefik.http.routers.phpldapadmin-redirect.entrypoints=web"
      - "traefik.http.routers.phpldapadmin-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - stack
    profiles:
      - admin

  phpmyadmin:
    image: 'phpmyadmin:latest'
    hostname: 'phpmyadmin'
    environment:
      PMA_ABSOLUTE_URI: 'https://phpmyadmin.localhost'
      PMA_HOST: 'mariadb'
    depends_on:
      - 'mariadb'
    deploy:
      resources:
        limits:
          memory: 256mb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.localhost`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=websecure"
      - "traefik.http.routers.phpmyadmin.tls=true"
      - "traefik.http.routers.phpmyadmin.service=phpmyadmin-http"
      - "traefik.http.services.phpmyadmin-http.loadbalancer.server.port=80"
      - "traefik.http.routers.phpmyadmin-redirect.rule=Host(`phpmyadmin.localhost`)"
      - "traefik.http.routers.phpmyadmin-redirect.entrypoints=web"
      - "traefik.http.routers.phpmyadmin-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - stack
    profiles:
      - admin

  keycloak:
    #    image: quay.io/keycloak/keycloak:21.0
    image: keycloak/keycloak:latest
    hostname: keycloak
    deploy:
      resources:
        limits:
          memory: 512mb
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
      KC_HOSTNAME: 'keycloak.localhost'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY: 'edge'
      KC_PROXY_HEADERS: 'xforwarded'
    volumes:
      # https://www.keycloak.org/server/importExport
      # To export: /opt/keycloak/bin/kc.sh export --dir /opt/keycloak/data/import --realm realm-idp
      - ./volumes/keycloak/realm-config:/opt/keycloak/data/import
      - ./volumes/keycloak/providers:/opt/keycloak/providers
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.service=keycloak-http"
      - "traefik.http.services.keycloak-http.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak-redirect.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak-redirect.entrypoints=web"
      - "traefik.http.routers.keycloak-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    command: 'start-dev --import-realm'
    networks:
      - stack

  mail:
    image: rnwood/smtp4dev:latest
    hostname: mail
    deploy:
      resources:
        limits:
          memory: 256mb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=stack"
      - "traefik.http.routers.mailserver.rule=Host(`mailserver.localhost`)"
      - "traefik.http.routers.mailserver.entrypoints=websecure"
      - "traefik.http.routers.mailserver.tls=true"
      - "traefik.http.routers.mailserver.service=mailserver-http"
      - "traefik.http.services.mailserver-http.loadbalancer.server.port=80"
      - "traefik.http.routers.mailserver-redirect.rule=Host(`mailserver.localhost`)"
      - "traefik.http.routers.mailserver-redirect.entrypoints=web"
      - "traefik.http.routers.mailserver-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - stack

  reverse-proxy:
    # The official v3 Traefik docker image
    image: traefik:v3.6
    hostname: proxy
    # Enables the web UI and tells Traefik to listen to docker
    command:
     - --api.insecure=true
     - --providers.docker
     - --providers.docker.exposedbydefault=false
     - --entrypoints.web.address=:80
     - --entrypoints.websecure.address=:443
     - --providers.file.filename=/etc/traefik/tls.yml
    deploy:
      resources:
        limits:
          memory: 128mb
    ports:
      # The HTTP port
      - "80:80"
      # The HTTPS port
      - "443:443"
      # The Web UI (enabled by --api.insecure=true)
      - "9080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/traefik/tls.yml:/etc/traefik/tls.yml:ro # Traefik TLS configuration
#      - ./volumes/traefik/tlsmkcert.yml:/etc/traefik/tls.yml:ro # Traefik TLS configuration with mkcert
      - ./volumes/traefik/certs:/etc/ssl/traefik:ro # SSL certificates
    networks:
      - stack

networks:
  stack:
    name: jahia-experience-suite-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.1.0/24

